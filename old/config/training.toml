[experiment]
name = "NIK DCE-MRI k-space fitting"
description = "SIREN implicit neural representation for radial k-space"

[data]
file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260115T150400.mat"
t_frame = 0
coil_idx = 0
z_slice_idx = -1
val_frac = 0.1

[model]
model_family = "siren"
hidden = 128
depth = 4
w0 = 15

[training]
steps = 6000
batch_size = 4096
optimizer = "Adam"
lr = 2e-4
grad_clip = 1.0
eval_every = 100
seed = 0

[training.plot]
plot_every = 1000
log_scale = true

[output]
base_path = "/scratch/rnga/vvpshenov/DCE_NIK/runs"

[logging]
level = "INFO"
console_every = 100

[wandb]
watch_interval = 0

[sweep]
entity = "spshenov-university-of-amsterdam"
project = "NIK-DCE-MRI"
method = "bayes"

[sweep.metric]
name = "best_val_loss"
goal = "minimize"

[sweep.parameters.model_family]
values = ["siren", "relu", "elu"]

[sweep.parameters.hidden]
values = [32, 64, 128, 256]

[sweep.parameters.depth]
values = [4, 6, 8]

[sweep.parameters.w0]
values = [10, 15, 30]
# w0 siren only
