[experiment]
name = "Best config: cell D + alpha=2.0"
description = "Locked-in best from FFL ablation: env=on, dcf=off, focal=on, alpha=2.0, subsample_frac=0.7. Beats NUFFT by ~+0.95 dB PSNR / -0.006 DISTS."

[data]
radial_file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260511T113026.mat"
t_frame = 0
coil_idx = 0
z_slice_idx = -1
subsample_frac = 0.7

[model]
model_family = "wire"
hidden = 64
depth = 8
w0 = 62.0
s0 = 10.0

[training]
steps = 20000
batch_size = 4096
optimizer = "Adam"
lr = 1e-4
grad_clip = 1.0
eval_every = 100
seed = 0
loss_type = "mse"
weight_decay = 0.003
warmup_steps = 4000
scheduler_patience = 50
scheduler_factor = 0.5
scheduler_min_lr = 1e-6

[training.plot]
plot_every = 2000
log_scale = true

[loss]
use_envelope     = true
use_dcf          = false
dcf_power        = 0.0
use_focal        = true
focal_alpha      = 2.0
focal_normalize  = true
focal_log_matrix = false
focal_warmup_steps = 1000

[normalization]
dcf_method = "simple_ramp"
envelope_bins = 128
envelope_statistic = "weighted_rms"
envelope_smooth_method = "moving_average"
envelope_smooth_width = 5
envelope_floor_fraction = 1e-3
global_scale_method = "weighted_rms"

[output]
base_path = "/scratch/rnga/vvpshenov/DCE_NIK/runs"

[logging]
level = "INFO"
console_every = 100

[wandb]
watch_interval = 0
