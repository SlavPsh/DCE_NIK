[experiment]
name = "Long training: daring-peccary config (sub=0.3, looking for grokking)"
description = "Best sub=0.3 config from previous sweep, long training with OneCycle LR"

[data]
radial_file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260326T114914_rad.mat"
cartesian_file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260326T113845_cart.mat"
t_frame = 0
coil_idx = 0
z_slice_idx = -1
subsample_frac = 0.3       # daring-peccary used 0.3

[model]
model_family = "wire"
hidden = 64
depth = 6
w0 = 32.0
s0 = 14.0

[training]
steps = 100000             # 12.5x longer than 8k
batch_size = 4096
optimizer = "Adam"
lr = 1e-4                  # base lr (OneCycle peaks at 10x = 1e-3)
grad_clip = 1.0
eval_every = 200
seed = 0
loss_type = "mse"
weight_decay = 0.003
warmup_steps = 5000        # 5% of total
scheduler_type = "onecycle"  # onecycle | cosine | plateau
scheduler_patience = 100   # only used for plateau
scheduler_factor = 0.5
scheduler_min_lr = 1e-7
image_metric_every = 2000  # less frequent for long runs

[training.plot]
plot_every = 10000
log_scale = true

[normalization]
dcf_method = "simple_ramp"
dcf_power = 0.0
use_envelope = true
use_dcf = true
envelope_bins = 128
envelope_statistic = "weighted_rms"
envelope_smooth_method = "moving_average"
envelope_smooth_width = 5
envelope_floor_fraction = 1e-3
global_scale_method = "weighted_rms"

[output]
base_path = "/scratch/rnga/vvpshenov/DCE_NIK/runs"

[logging]
level = "INFO"
console_every = 500

[wandb]
watch_interval = 0
