# step 14b, siren grid sweep

[experiment]
name = "Step 14b: SIREN grid sweep (+LR scheduler)"
description = "Focused grid sweep of SIREN around Step 13 best configs, with ReduceLROnPlateau"

[data]
file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260115T150400.mat"
t_frame = 0
coil_idx = 0
z_slice_idx = -1
val_frac = 0.1

[model]
model_family = "siren"
hidden = 64
depth = 10
w0 = 70.0
s0 = 10.0

[training]
steps = 20000
batch_size = 4096
optimizer = "Adam"
lr = 1e-4
grad_clip = 1.0
weight_decay = 0.002
loss_type = "mse"
eval_every = 50
seed = 0
conj_weight = 0.0
density_weight = 0.0
# lr scheduler
scheduler_patience = 50
scheduler_factor = 0.5
scheduler_min_lr = 1e-6

[training.plot]
plot_every = 5000
log_scale = true

[output]
base_path = "/scratch/rnga/vvpshenov/DCE_NIK/runs"

[logging]
level = "INFO"
console_every = 200

[wandb]
watch_interval = 0

[sweep]
name = "Step 14b: SIREN grid (+ReduceLROnPlateau)"
entity = "spshenov-university-of-amsterdam"
project = "NIK-DCE-MRI"
method = "grid"

[sweep.metric]
name = "best_val_loss"
goal = "minimize"

# sweep params
[sweep.parameters.model_family]
values = ["siren"]

# grid 144 runs
[sweep.parameters.hidden]
values = [48, 64]

[sweep.parameters.depth]
values = [8, 10]

[sweep.parameters.w0]
values = [55.0, 70.0, 80.0]

[sweep.parameters.lr]
values = [3e-5, 5e-5, 1e-4]

[sweep.parameters.weight_decay]
values = [0.0, 0.003]

[sweep.parameters.density_weight]
values = [0.0, 0.1]
