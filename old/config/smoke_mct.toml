[experiment]
name = "Multicoil+time smoke"
description = "1000 steps, h=96 d=8, batch=16384, cell D loss with alpha=1.5. Real-GPU sanity for the multicoil+time trainer."

[data]
radial_file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260527T175428.mat"
t_frame = 0
coil_idx = 0
z_slice_idx = -1
subsample_frac = 0.7

[model]
model_family = "wire_coil_t"
hidden = 96
depth = 8
w0 = 62.0
s0 = 10.0
coil_embed_dim = 8
dropout = 0.0

[training]
steps = 1000
batch_size = 16384
optimizer = "Adam"
lr = 1e-4
grad_clip = 1.0
eval_every = 100
seed = 0
weight_decay = 0.003
warmup_steps = 200
scheduler_type = "plateau"
scheduler_patience = 50
scheduler_factor = 0.5
scheduler_min_lr = 1e-6
image_metric_every = 1000

[training.plot]
plot_every = 1000
log_scale = true

[loss]
use_envelope     = true
use_dcf          = false
dcf_power        = 0.0
use_focal        = true
focal_alpha      = 1.5
focal_normalize  = true
focal_log_matrix = false
focal_warmup_steps = 200

[normalization]
dcf_method = "simple_ramp"
envelope_bins = 128
envelope_statistic = "weighted_rms"
envelope_smooth_method = "moving_average"
envelope_smooth_width = 5
envelope_floor_fraction = 1e-3
global_scale_method = "weighted_rms"

[output]
base_path = "/scratch/rnga/vvpshenov/DCE_NIK/runs"

[logging]
level = "INFO"
console_every = 100

[wandb]
watch_interval = 0
