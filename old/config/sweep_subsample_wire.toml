[experiment]
name = "Sweep: subsample fraction + WIRE params"
description = "Envelope norm, no DCF. Sweep over spoke subsampling and WIRE architecture."

[data]
radial_file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260326T114914_rad.mat"
cartesian_file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260326T113845_cart.mat"
t_frame = 0
coil_idx = 0
z_slice_idx = -1
subsample_frac = 1.0

[model]
model_family = "wire"
hidden = 64
depth = 8
w0 = 62.0
s0 = 10.0

[training]
steps = 20000
batch_size = 4096
optimizer = "Adam"
lr = 1e-4
grad_clip = 1.0
eval_every = 100
seed = 0
loss_type = "mse"
weight_decay = 0.003
warmup_steps = 4000
scheduler_patience = 50
scheduler_factor = 0.5
scheduler_min_lr = 1e-6

[training.plot]
plot_every = 5000
log_scale = true

[normalization]
dcf_method = "simple_ramp"
dcf_power = 0.0               # no DCF — envelope only
use_envelope = true
use_dcf = true
envelope_bins = 128
envelope_statistic = "weighted_rms"
envelope_smooth_method = "moving_average"
envelope_smooth_width = 5
envelope_floor_fraction = 1e-3
global_scale_method = "weighted_rms"

[output]
base_path = "/scratch/rnga/vvpshenov/DCE_NIK/runs"

[logging]
level = "INFO"
console_every = 100

[wandb]
watch_interval = 0

[sweep]
name = "Subsample + WIRE params (envelope, no DCF)"
entity = "spshenov-university-of-amsterdam"
project = "NIK-DCE-MRI-CartEval"
method = "bayes"
run_cap = 50

[sweep.metric]
name = "cart_eval_loss"
goal = "minimize"

[sweep.parameters.subsample_frac]
values = [0.1, 0.25, 0.5, 1.0]

[sweep.parameters.hidden]
values = [48, 64, 96]

[sweep.parameters.depth]
values = [6, 8, 10]

[sweep.parameters.w0]
min = 30.0
max = 80.0

[sweep.parameters.s0]
min = 3.0
max = 20.0
