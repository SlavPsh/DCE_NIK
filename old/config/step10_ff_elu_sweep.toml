# step 10, ff elu sweep

[experiment]
name = "Step 10: FF+ELU sweep"
description = "Bayesian sweep over Fourier Features + ELU model hyperparams"

[data]
file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260115T150400.mat"
t_frame = 0
coil_idx = 0
z_slice_idx = -1
val_frac = 0.1

[model]
model_family = "ff_elu"
hidden = 64
depth = 8
k_freq = 64
k_sigma = 6.0

[training]
steps = 20000
batch_size = 4096
optimizer = "Adam"
lr = 2e-4
grad_clip = 1.0
weight_decay = 0.005
loss_type = "mse"
eval_every = 50
seed = 0

[training.plot]
plot_every = 5000
log_scale = true

[output]
base_path = "/scratch/rnga/vvpshenov/DCE_NIK/runs"

[logging]
level = "INFO"
console_every = 200

[wandb]
watch_interval = 0

[sweep]
name = "Step 10: FF+ELU sweep (Bayesian, 20k steps)"
entity = "spshenov-university-of-amsterdam"
project = "NIK-DCE-MRI"
method = "bayes"
run_cap = 50

[sweep.metric]
name = "best_val_loss"
goal = "minimize"

[sweep.parameters.model_family]
values = ["ff_elu"]

[sweep.parameters.hidden]
values = [32, 48, 64, 96]

[sweep.parameters.depth]
values = [4, 6, 8, 10]

[sweep.parameters.k_freq]
values = [32, 64, 96]

[sweep.parameters.k_sigma]
min = 1.0
max = 12.0

[sweep.parameters.lr]
min = 0.00005
max = 0.002
distribution = "log_uniform_values"

[sweep.parameters.weight_decay]
min = 0.0001
max = 0.01
distribution = "log_uniform_values"
