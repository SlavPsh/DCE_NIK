# step 8, loss function compare

[experiment]
name = "Step 8: loss function comparison"
description = "Compare 5 loss weightings on compact SIREN baseline (20k steps)"

[data]
file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260115T150400.mat"
t_frame = 0
coil_idx = 0
z_slice_idx = -1
val_frac = 0.1

[model]
model_family = "siren"
hidden = 64
depth = 8
w0 = 60

[training]
steps = 20000
batch_size = 4096
optimizer = "Adam"
lr = 2e-4
grad_clip = 1.0
weight_decay = 0.009
eval_every = 50
seed = 0

[training.plot]
plot_every = 5000
log_scale = true

[output]
base_path = "/scratch/rnga/vvpshenov/DCE_NIK/runs"

[logging]
level = "INFO"
console_every = 200

[wandb]
watch_interval = 0

[sweep]
name = "Step 8: loss function comparison (compact SIREN, 20k)"
entity = "spshenov-university-of-amsterdam"
project = "NIK-DCE-MRI"
method = "grid"
run_cap = 5

[sweep.metric]
name = "best_val_loss"
goal = "minimize"

[sweep.parameters.loss_type]
values = ["mse", "wmse_sqrt", "wmse_inv", "relative_mse", "log_mse"]
