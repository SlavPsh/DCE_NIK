selection: NIK hyperparameters by validation kNMSE ONLY (width 768, k_sigma 2.5); truth post-selection
execution: SLURM, mix of full-A100 + MIG slices (1g.10gb/2g.20gb/4g.40gb)
status: RESULT REQUIRES REVIEW
