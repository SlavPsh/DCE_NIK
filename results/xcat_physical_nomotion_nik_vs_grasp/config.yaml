task: physical no-motion NIK vs GRASP-Pro (clean baseline before breathing)
dataset: XCAT-ERIC/results/simulation_results_20260816T210718.mat (respPeriod N/A, physical SPGR truth)
slice: zi=10; matrix 220; 8 coils; 344 frames x 7 angles x 16 partitions (aligned stack-of-stars)
common_inputs: identical train k-space / traj / coils / matrix / noise for both methods
