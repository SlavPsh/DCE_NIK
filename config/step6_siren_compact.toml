# Step 6: SIREN compact model sweep
#
# Goal: find the smallest SIREN that maintains good image quality.
# The 4x first-layer w0 multiplier has been removed — w0 now means
# exactly what is passed (no hidden scaling).
#
# Previous best: h=256, d=8, w0=15 (effective 60 with old 4x), wd=1e-3
#   → 25.92 dB PSNR, 0.54 SSIM
#
# Sweep: w0, depth, hidden (small focus), lr, batch_size, weight_decay
#
# Usage:
#   sbatch gpu_job_sweep.sh config/step6_siren_compact.toml

[experiment]
name = "Step 6: SIREN compact sweep"
description = "Find smallest SIREN with good quality (no 4x w0 multiplier)"

[data]
file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260115T150400.mat"
t_frame = 0
coil_idx = 0
z_slice_idx = -1
val_frac = 0.1

[model]
model_family = "siren"
hidden = 128
depth = 4
w0 = 30

[training]
steps = 3000
batch_size = 4096
optimizer = "Adam"
lr = 2e-4
grad_clip = 1.0
weight_decay = 0.001
eval_every = 50
seed = 0

[training.plot]
plot_every = 1000
log_scale = true

[output]
base_path = "/scratch/rnga/vvpshenov/DCE_NIK/runs"

[logging]
level = "INFO"
console_every = 100

[wandb]
watch_interval = 0

[sweep]
name = "Step 6: SIREN compact (no 4x w0, Bayesian)"
entity = "spshenov-university-of-amsterdam"
project = "NIK-DCE-MRI"
method = "bayes"
run_cap = 100

[sweep.metric]
name = "best_val_loss"
goal = "minimize"

[sweep.parameters.model_family]
values = ["siren"]

[sweep.parameters.hidden]
values = [64, 96, 128, 192, 256]

[sweep.parameters.depth]
values = [4, 6, 8]

[sweep.parameters.w0]
min = 10.0
max = 80.0

[sweep.parameters.lr]
min = 0.0001
max = 0.002
distribution = "log_uniform_values"

[sweep.parameters.batch_size]
values = [2048, 4096, 8192]

[sweep.parameters.weight_decay]
min = 0.0
max = 0.01

