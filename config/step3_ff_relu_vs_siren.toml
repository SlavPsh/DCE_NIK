# Step 3: Fourier Features + ReLU MLP
#
# Question: does explicit frequency encoding close the gap with SIREN?
# Key hyperparameter: sigma of the Fourier feature mapping (controls bandwidth).
# Per-family depth/width ranges ensure fair comparison at matched capacity.
#
# Usage:
#   sbatch gpu_job_sweep.sh config/step3_ff_relu_vs_siren.toml
#   sbatch gpu_job_sweep.sh config/step3_ff_relu_vs_siren.toml SWEEP_ID [COUNT]

[experiment]
name = "Step 3: FF+ReLU vs SIREN"
description = "Does explicit Fourier feature encoding close the gap with SIREN?"

[data]
file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260115T150400.mat"
t_frame = 0
coil_idx = 0
z_slice_idx = -1          # -1 = middle slice (auto)
val_frac = 0.1

[model]
model_family = "ff_relu"
hidden = 128
depth = 4
w0 = 15
k_freq = 64
k_sigma = 6.0

[training]
steps = 3000
batch_size = 4096
optimizer = "Adam"
lr = 2e-4
grad_clip = 1.0
eval_every = 50
seed = 0

[training.plot]
plot_every = 1000
log_scale = true

[output]
base_path = "/scratch/rnga/vvpshenov/DCE_NIK/runs"

[logging]
level = "INFO"
console_every = 100

[wandb]
watch_interval = 0

[sweep]
entity = "spshenov-university-of-amsterdam"
project = "NIK-DCE-MRI"
method = "grid"

[sweep.metric]
name = "best_val_loss"
goal = "minimize"

# Sweep over model families with per-family architecture ranges.
# hidden/depth are swept over the union; [family_params] restricts
# which combos are valid per family (skip logic in train_wandb.py).
# k_sigma only affects FF families (existing skip logic handles this).
[sweep.parameters.model_family]
values = ["ff_relu", "ff_siren", "siren", "relu"]

[sweep.parameters.hidden]
values = [64, 128, 256]          # union across families

[sweep.parameters.depth]
values = [3, 4, 6, 8]            # union across families

[sweep.parameters.w0]
values = [15]

[sweep.parameters.k_freq]
values = [64]

[sweep.parameters.k_sigma]
values = [1.0, 2.0, 3.0, 4.0, 6.0, 8.0, 12.0]

# ---- Per-family valid architecture ranges ----
# FF models get wider input from the Fourier layer, so use smaller hidden/depth.
# Plain models need wider/deeper nets to compensate for no frequency encoding.
[family_params.ff_relu]
hidden = [64, 128]
depth  = [3, 4]

[family_params.ff_siren]
hidden = [64, 128]
depth  = [3, 4]

[family_params.siren]
hidden = [128, 256]
depth  = [4, 6, 8]

[family_params.relu]
hidden = [128, 256]
depth  = [4, 6, 8]
