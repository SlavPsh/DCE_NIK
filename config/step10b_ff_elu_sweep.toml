# Step 10b: FF+ELU sweep — broader architecture search
#
# Follow-up to step10: fix lr=1.5e-3 and wd=1e-4 (clear winners from step10),
# broaden k_freq (96 dominated → extend to 192), wider hidden/depth grid,
# and wider k_sigma range.
#
# Usage:
#   sbatch gpu_job_sweep.sh config/step10b_ff_elu_sweep.toml

[experiment]
name = "Step 10b: FF+ELU broad architecture sweep"
description = "Fixed lr/wd, broader k_freq/k_sigma/hidden/depth search"

[data]
file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260115T150400.mat"
t_frame = 0
coil_idx = 0
z_slice_idx = -1
val_frac = 0.1

[model]
model_family = "ff_elu"
hidden = 64
depth = 8
k_freq = 96
k_sigma = 10.0

[training]
steps = 20000
batch_size = 4096
optimizer = "Adam"
lr = 1.5e-3
grad_clip = 1.0
weight_decay = 1e-4
loss_type = "mse"
eval_every = 50
seed = 0

[training.plot]
plot_every = 5000
log_scale = true

[output]
base_path = "/scratch/rnga/vvpshenov/DCE_NIK/runs"

[logging]
level = "INFO"
console_every = 200

[wandb]
watch_interval = 0

[sweep]
name = "Step 10b: FF+ELU broad arch sweep (Bayesian, 20k steps)"
entity = "spshenov-university-of-amsterdam"
project = "NIK-DCE-MRI"
method = "bayes"
run_cap = 50

[sweep.metric]
name = "best_val_loss"
goal = "minimize"

[sweep.parameters.model_family]
values = ["ff_elu"]

[sweep.parameters.hidden]
values = [32, 48, 64, 96, 128]

[sweep.parameters.depth]
values = [4, 6, 8, 10, 12]

[sweep.parameters.k_freq]
values = [64, 96, 128, 160, 192]

[sweep.parameters.k_sigma]
min = 1.0
max = 20.0

