[experiment]
name = "Multicoil sweep: subsampling + WIRE params"
description = "Direct multicoil output, SENSE recon, grid sweep over subsampling and architecture"

[data]
radial_file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260326T114914_rad.mat"
cartesian_file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260326T113845_cart.mat"
t_frame = 0
z_slice_idx = -1
subsample_frac = 1.0
multicoil = true

[model]
model_family = "wire"
hidden = 64
depth = 6
w0 = 32.0
s0 = 14.0

[training]
steps = 8000
batch_size = 4096
optimizer = "Adam"
lr = 1e-4
grad_clip = 1.0
eval_every = 100
seed = 0
loss_type = "mse"
weight_decay = 0.003
warmup_steps = 1600
scheduler_patience = 50
scheduler_factor = 0.5
scheduler_min_lr = 1e-6
image_metric_every = 1000

[training.plot]
plot_every = 5000
log_scale = true

[normalization]
dcf_method = "simple_ramp"
dcf_power = 0.0
use_envelope = true
use_dcf = true
envelope_bins = 128
envelope_statistic = "weighted_rms"
envelope_smooth_method = "moving_average"
envelope_smooth_width = 5
envelope_floor_fraction = 1e-3
global_scale_method = "weighted_rms"

[output]
base_path = "/scratch/rnga/vvpshenov/DCE_NIK/runs"

[logging]
level = "INFO"
console_every = 100

[wandb]
watch_interval = 0

[sweep]
name = "Multicoil: subsampling + WIRE params"
entity = "spshenov-university-of-amsterdam"
project = "NIK-DCE-MRI-CartEval"
method = "grid"
run_cap = 72

[sweep.metric]
name = "delta_haarpsi"
goal = "maximize"

[sweep.parameters.subsample_frac]
values = [0.1, 0.3, 0.5, 0.7, 0.9, 1.0]

[sweep.parameters.w0]
values = [32.0, 55.0, 77.0]

[sweep.parameters.depth]
values = [6, 8]

[sweep.parameters.s0]
values = [14.0, 18.0]
