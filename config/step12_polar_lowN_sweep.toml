# step 12, polar low n sweep

[experiment]
name = "Step 12: Polar WIRE low-N sweep"
description = "Bayesian sweep over Polar + WIRE with low angular modes (N=4..10)"

[data]
file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260115T150400.mat"
t_frame = 0
coil_idx = 0
z_slice_idx = -1
val_frac = 0.1

[model]
model_family = "polar"
hidden = 128
depth = 4
w0 = 30.0
s0 = 10.0
n_angular_modes = 8
radial_type = "wire"

[training]
steps = 20000
batch_size = 4096
optimizer = "Adam"
lr = 2e-4
grad_clip = 1.0
weight_decay = 0.005
loss_type = "mse"
eval_every = 50
seed = 0
# polar constraint weights
dc_weight = 0.01
density_weight = 1.0
conj_weight = 0.01

[training.plot]
plot_every = 5000
log_scale = true

[output]
base_path = "/scratch/rnga/vvpshenov/DCE_NIK/runs"

[logging]
level = "INFO"
console_every = 200

[wandb]
watch_interval = 0

[sweep]
name = "Step 12: Polar WIRE low-N sweep (Bayesian, 20k steps)"
entity = "spshenov-university-of-amsterdam"
project = "NIK-DCE-MRI"
method = "bayes"
run_cap = 50

[sweep.metric]
name = "best_val_loss"
goal = "minimize"

[sweep.parameters.model_family]
values = ["polar"]

[sweep.parameters.radial_type]
values = ["wire"]

# param count guide

[sweep.parameters.n_angular_modes]
values = [4, 6, 8, 10]

[sweep.parameters.hidden]
values = [96, 128]

[sweep.parameters.depth]
values = [3, 4, 5]

[sweep.parameters.w0]
min = 10.0
max = 60.0

[sweep.parameters.s0]
min = 1.0
max = 15.0

[sweep.parameters.lr]
min = 0.0001
max = 0.001
distribution = "log_uniform_values"

[sweep.parameters.weight_decay]
min = 0.001
max = 0.01
distribution = "log_uniform_values"
