[experiment]
name = "wire deep low w0, sub 0.5, 30k steps"
description = "single frame single coil wire, deep depth 8 10 12, low w0 16 24 32, sub 0.5, no dropout"

[data]
radial_file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260326T114914_rad.mat"
cartesian_file = "/scratch/rnga/vvpshenov/XCAT-ERIC/results/simulation_results_20260326T113845_cart.mat"
t_frame = 0
coil_idx = 0
z_slice_idx = -1
subsample_frac = 0.5

[model]
model_family = "wire"
hidden = 64
depth = 10
w0 = 24.0
s0 = 14.0
dropout = 0.0

[training]
steps = 10000
batch_size = 4096
optimizer = "Adam"
lr = 1e-4
grad_clip = 1.0
eval_every = 200
seed = 0
loss_type = "mse"
weight_decay = 0.003
warmup_steps = 1600
scheduler_patience = 50
scheduler_factor = 0.5
scheduler_min_lr = 1e-6

[training.plot]
plot_every = 1000
log_scale = true

[normalization]
dcf_method = "simple_ramp"
dcf_power = 0.0
use_envelope = true
use_dcf = true
envelope_bins = 128
envelope_statistic = "weighted_rms"
envelope_smooth_method = "moving_average"
envelope_smooth_width = 5
envelope_floor_fraction = 1e-3
global_scale_method = "weighted_rms"

[output]
base_path = "/scratch/rnga/vvpshenov/DCE_NIK/runs"

[logging]
level = "INFO"
console_every = 500

[wandb]
watch_interval = 0

[sweep]
name = "wire deep low w0, sub 0.5, 30k steps"
entity = "spshenov-university-of-amsterdam"
project = "NIK-DCE-MRI-CartEval"
method = "grid"
run_cap = 18

[sweep.metric]
name = "cart_eval_loss"
goal = "minimize"

[sweep.parameters.depth]
values = [8, 10, 12]

[sweep.parameters.w0]
values = [16.0, 24.0, 32.0]

[sweep.parameters.s0]
values = [14.0, 18.0]
